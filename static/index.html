<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideCheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0a0f0c;
      color: #e6f2ea;
      background-image:
        repeating-linear-gradient(0deg, rgba(57,255,138,0.03) 0px, rgba(57,255,138,0.03) 1px, transparent 1px, transparent 3px);
    }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* ---------- Auth / setup / history: centered plain screens ---------- */
    .plain-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 18px 60px;
    }
    .container { width: 100%; max-width: 400px; }

    .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; text-align: center; }
    .brand-mark {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%; background: #39ff8a;
      box-shadow: 0 0 8px #39ff8a;
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #f2fbf5;
    }
    .tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #6f9c81;
      margin-top: 6px;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 16px 0 7px;
      color: #5c7f6b;
    }
    select, input, button {
      width: 100%;
      font-size: 16px;
      padding: 13px 14px;
      border-radius: 4px;
      border: 1px solid #23342b;
      box-sizing: border-box;
      font-family: 'JetBrains Mono', monospace;
      background: #0e1512;
      color: #e6f2ea;
    }
    select, input { transition: border-color 0.15s ease; }
    select:focus, input:focus { outline: none; border-color: #39ff8a; }
    input::placeholder { color: #4a6656; }
    button {
      background: #39ff8a;
      color: #06110a;
      border: none;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 18px;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    button:disabled { background: #23342b; color: #5c7f6b; cursor: not-allowed; }

    .btn-row { display: flex; gap: 10px; margin-top: 18px; }
    .btn-row button { margin-top: 0; }
    .btn-take { background: #39ff8a !important; color: #06110a !important; }
    .btn-skip { background: transparent !important; color: #ff6b6b !important; border: 1px solid #4a2b2b !important; }

    .link-btn {
      background: none; color: #5c7f6b; font-size: 12px; font-weight: 600;
      font-family: 'JetBrains Mono', monospace; text-transform: none;
      letter-spacing: 0; text-decoration: none; margin-top: 6px; padding: 10px; border: none;
    }
    .link-btn:active { transform: none; opacity: 0.5; }

    .card {
      background: #0e1512;
      border: 1px solid #1c2b21;
      border-radius: 6px;
      padding: 22px;
    }

    #setup-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #9fd8b4;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 0.3px;
    }

    #result {
      display: none; margin-top: 20px; padding: 24px 20px; border-radius: 6px;
      text-align: center; animation: pop 0.25s ease; border: 1px solid;
    }
    @keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #result.take { background: #0d1f13; border-color: #39ff8a; }
    #result.skip { background: #1f0d0d; border-color: #ff6b6b; }
    #verdict {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px; font-weight: 700; margin-bottom: 5px; letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    #result.take #verdict { color: #39ff8a; }
    #result.skip #verdict { color: #ff6b6b; }
    #detail-line { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; color: #9fd8b4; }
    #result.skip #detail-line { color: #d99; }
    .breakdown {
      margin-top: 16px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left;
      border-radius: 4px; padding: 13px 15px; background: rgba(255,255,255,0.03);
    }
    .breakdown div { display: flex; justify-content: space-between; padding: 4px 0; }
    .breakdown div:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.06); }

    .track-question {
      margin-top: 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
      font-weight: 600; text-align: center; text-transform: uppercase; letter-spacing: 0.5px;
    }
    #result.take .track-question { color: #9fd8b4; }
    #result.skip .track-question { color: #d99; }

    #tracked-msg {
      display: none; margin-top: 12px; text-align: center; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; font-weight: 600; color: #39ff8a; background: rgba(57,255,138,0.08);
      border-radius: 4px; padding: 10px;
    }

    #history-list { margin-top: 4px; }
    .ride-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 0; border-bottom: 1px solid #1c2b21; font-family: 'JetBrains Mono', monospace; font-size: 13px;
    }
    .ride-row:last-child { border-bottom: none; }
    .ride-date { color: #5c7f6b; font-size: 11px; margin-top: 2px; }
    .ride-profit { font-weight: 700; color: #39ff8a; }

    .totals-row { display: flex; justify-content: space-between; padding: 9px 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    .totals-row:not(:last-child) { border-bottom: 1px solid #1c2b21; }
    .totals-row span:first-child { color: #5c7f6b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    .totals-row span:last-child { font-weight: 700; color: #e6f2ea; }

    .guest-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #ff6b6b; font-weight: 700;
      margin-bottom: 10px; text-align: center; background: rgba(255,107,107,0.08);
      padding: 8px 12px; border-radius: 4px; letter-spacing: 0.3px;
    }

    .auth-toggle { display: flex; gap: 4px; margin-bottom: 14px; background: #0e1512; padding: 4px; border-radius: 6px; border: 1px solid #1c2b21; }
    .auth-toggle button {
      margin-top: 0; background: transparent; color: #5c7f6b; font-size: 12px; padding: 10px; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .auth-toggle button.active { background: #39ff8a; color: #06110a; }
    .error-text { color: #ff6b6b; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; margin-top: 10px; display: none; text-align: center; }

    .back-link { padding-left: 0 !important; }
    .hidden { display: none; }

    /* ---------- Main screen: full-height scroll-snap sections ---------- */
    #main-screen.active {
      position: fixed; inset: 0; overflow: hidden;
    }
    .scroll-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }
    .scroll-section {
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .car-readout {
      text-align: center;
      max-width: 380px;
    }
    .car-readout .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #5c7f6b;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }
    .car-readout .vehicle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #f2fbf5;
      margin-bottom: 18px;
      line-height: 1.2;
    }
    .stat-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 8px; }
    .stat-box {
      border: 1px solid #1c2b21;
      background: #0e1512;
      border-radius: 6px;
      padding: 14px 18px;
      min-width: 100px;
    }
    .stat-box .num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #39ff8a;
    }
    .stat-box .unit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #5c7f6b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .scroll-cue {
      position: absolute;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #5c7f6b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .scroll-cue svg { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

    .calc-section { justify-content: flex-start; padding-top: 40px; overflow-y: auto; }
    .calc-inner { width: 100%; max-width: 400px; }
    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #5c7f6b;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="plain-wrap hidden">
    <div class="container">
      <div class="brand">
        <div class="brand-mark">
          <div class="dot"></div>
          <h1>RideCheck</h1>
        </div>
        <div class="tagline">profit tracking for doordash &amp; ubereats drivers</div>
      </div>

      <div class="auth-toggle">
        <button id="tab-login" class="active" onclick="switchAuthTab('login')">Log In</button>
        <button id="tab-register" onclick="switchAuthTab('register')">Sign Up</button>
      </div>

      <div class="card">
        <label style="margin-top:0;">Username or Email</label>
        <input id="auth-identifier" type="text" placeholder="Enter username or email">

        <label>Password</label>
        <input id="auth-password" type="password" placeholder="••••••••">

        <button id="auth-submit-btn" onclick="submitAuth()">Log In</button>
        <div class="error-text" id="auth-error"></div>
      </div>

      <div style="text-align:center;">
        <button class="link-btn" onclick="continueAsGuest()">continue as guest &rarr;</button>
      </div>
    </div>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="plain-wrap hidden">
    <div class="container">
      <div class="brand">
        <div class="brand-mark"><div class="dot"></div><h1>RideCheck</h1></div>
      </div>
      <div id="setup-title"></div>
      <div class="card">
        <label style="margin-top:0;">Year</label>
        <select id="year"></select>

        <label>Make</label>
        <select id="make"></select>

        <label>Model</label>
        <select id="model"></select>

        <label>State (2-letter code)</label>
        <input id="state" value="NY" maxlength="2" style="text-transform:uppercase;">

        <label>Target profit per hour ($)</label>
        <input id="target-rate" type="number" value="30">

        <button onclick="saveCar()">Save &amp; Continue</button>
      </div>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="main-screen" class="hidden">
    <div class="scroll-container">

      <!-- Section 1: car status -->
      <section class="scroll-section">
        <div id="guest-notice" class="guest-badge hidden">guest mode — data clears when you close this tab</div>
        <div class="car-readout">
          <div class="label">vehicle on file</div>
          <div class="vehicle" id="car-vehicle-line"></div>
          <div class="stat-row">
            <div class="stat-box">
              <div class="num" id="car-mpg-num">--</div>
              <div class="unit">mpg</div>
            </div>
            <div class="stat-box">
              <div class="num" id="car-target-num">--</div>
              <div class="unit">target $/hr</div>
            </div>
          </div>
        </div>
        <div class="scroll-cue" onclick="scrollToCalc()">
          scroll to check a ride
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#39ff8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </div>
      </section>

      <!-- Section 2: calculator -->
      <section class="scroll-section calc-section" id="calc-section">
        <div class="calc-inner">
          <div class="section-label">check a ride</div>

          <div class="card">
            <label style="margin-top:0;">Fare ($)</label>
            <input id="fare" type="number" inputmode="decimal" placeholder="e.g. 18.50" autofocus onkeydown="if(event.key==='Enter'){event.preventDefault(); document.getElementById('miles').focus();}">

            <label>Miles</label>
            <input id="miles" type="number" inputmode="decimal" placeholder="e.g. 12" onkeydown="if(event.key==='Enter'){event.preventDefault(); document.getElementById('duration').focus();}">

            <label>Duration (minutes)</label>
            <input id="duration" type="number" inputmode="decimal" placeholder="e.g. 25" onkeydown="if(event.key==='Enter'){event.preventDefault(); checkRide();}">

            <button onclick="checkRide()">Check Ride</button>
          </div>

          <div id="result">
            <div id="verdict"></div>
            <div id="detail-line"></div>
            <div class="breakdown" id="breakdown"></div>

            <div class="track-question">did you take this ride?</div>
            <div class="btn-row">
              <button class="btn-take" onclick="logRide(true)">Took it</button>
              <button class="btn-skip" onclick="logRide(false)">Skipped it</button>
            </div>
            <div id="tracked-msg"></div>
          </div>

          <div style="text-align:center; margin-top:14px;">
            <button class="link-btn" onclick="showHistory()">view history &rarr;</button><br>
            <button class="link-btn" onclick="showSetup()">edit car / settings</button><br>
            <button class="link-btn" id="logout-btn" onclick="logout()">log out</button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- HISTORY SCREEN -->
  <div id="history-screen" class="plain-wrap hidden">
    <div class="container">
      <button class="link-btn back-link" onclick="showMain()">&larr; back</button>
      <div class="card" id="totals" style="margin-top:12px;"></div>
      <div class="card" id="history-list" style="margin-top:14px;"></div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let lastCheckedRide = null;
    let isGuest = false;
    let authMode = "login";

    function show(id) {
      ["auth-screen", "setup-screen", "main-screen", "history-screen"].forEach(function(s) {
        const el = document.getElementById(s);
        el.classList.toggle("hidden", s !== id);
        if (s === "main-screen") el.classList.toggle("active", s === id);
      });
    }

    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById("tab-login").classList.toggle("active", mode === "login");
      document.getElementById("tab-register").classList.toggle("active", mode === "register");
      document.getElementById("auth-submit-btn").innerText = mode === "login" ? "Log In" : "Sign Up";
      document.getElementById("auth-error").style.display = "none";
    }

    async function submitAuth() {
      const identifier = document.getElementById("auth-identifier").value.trim();
      const password = document.getElementById("auth-password").value;
      const errorEl = document.getElementById("auth-error");
      errorEl.style.display = "none";

      if (!identifier || !password) {
        errorEl.innerText = "Enter a username/email and password.";
        errorEl.style.display = "block";
        return;
      }

      const isEmail = identifier.includes("@");
      const body = isEmail ? { email: identifier, password: password } : { username: identifier, password: password };
      const endpoint = authMode === "login" ? "/api/login" : "/api/register";

      try {
        const res = await fetch(API + endpoint, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (data.error) {
          errorEl.innerText = data.error;
          errorEl.style.display = "block";
          return;
        }

        isGuest = false;
        await afterLogin();
      } catch (err) {
        errorEl.innerText = "Something went wrong: " + err.message;
        errorEl.style.display = "block";
      }
    }

    function setCarReadout(year, make, model, mpg, targetRate) {
      document.getElementById("car-vehicle-line").innerText = year + " " + make + " " + model;
      document.getElementById("car-mpg-num").innerText = mpg;
      document.getElementById("car-target-num").innerText = targetRate;
    }

    function scrollToCalc() {
      document.getElementById("calc-section").scrollIntoView({ behavior: "smooth" });
    }

    function continueAsGuest() {
      isGuest = true;
      document.getElementById("guest-notice").classList.remove("hidden");
      document.getElementById("logout-btn").innerText = "exit guest mode";

      const guestCar = sessionStorage.getItem("guest_car");
      if (guestCar) {
        const car = JSON.parse(guestCar);
        setCarReadout(car.year, car.make, car.model, car.mpg, car.target_hourly_rate);
        show("main-screen");
      } else {
        document.getElementById("setup-title").innerText = "set up your car and target hourly profit to get started";
        loadYears();
        show("setup-screen");
      }
    }

    async function logout() {
      if (isGuest) {
        sessionStorage.clear();
        isGuest = false;
        document.getElementById("guest-notice").classList.add("hidden");
        document.getElementById("logout-btn").innerText = "log out";
      } else {
        await fetch(API + "/api/logout", { method: "POST", credentials: "include" });
      }
      show("auth-screen");
    }

    async function afterLogin() {
      const res = await fetch(API + "/api/settings", { credentials: "include" });
      const data = await res.json();
      if (data.configured) {
        setCarReadout(data.year, data.make, data.model, data.mpg, data.target_hourly_rate);
        show("main-screen");
      } else {
        document.getElementById("setup-title").innerText = "set up your car and target hourly profit to get started";
        await loadYears();
        show("setup-screen");
      }
    }

    async function init() {
      const res = await fetch(API + "/api/me", { credentials: "include" });
      const data = await res.json();
      if (data.logged_in) {
        await afterLogin();
      } else {
        show("auth-screen");
      }
    }

    async function loadYears() {
      const res = await fetch(API + "/api/years");
      const years = await res.json();
      const sel = document.getElementById("year");
      sel.innerHTML = years.map(function(y) { return "<option value=\"" + y + "\">" + y + "</option>"; }).join("");
      await loadMakes();
    }

    async function loadMakes(preserveMake, preserveModel) {
      const year = document.getElementById("year").value;
      const res = await fetch(API + "/api/makes?year=" + year);
      const makes = await res.json();
      const sel = document.getElementById("make");
      sel.innerHTML = makes.map(function(m) { return "<option value=\"" + m + "\">" + m + "</option>"; }).join("");
      if (preserveMake && makes.includes(preserveMake)) sel.value = preserveMake;
      await loadModels(preserveModel);
    }

    async function loadModels(preserveModel) {
      const year = document.getElementById("year").value;
      const make = document.getElementById("make").value;
      const res = await fetch(API + "/api/models?year=" + year + "&make=" + encodeURIComponent(make));
      const models = await res.json();
      const sel = document.getElementById("model");
      sel.innerHTML = models.map(function(m) { return "<option value=\"" + m + "\">" + m + "</option>"; }).join("");
      if (preserveModel && models.includes(preserveModel)) sel.value = preserveModel;
    }

    document.getElementById("year").addEventListener("change", function() {
      loadMakes(document.getElementById("make").value, document.getElementById("model").value);
    });
    document.getElementById("make").addEventListener("change", function() {
      loadModels();
    });

    async function saveCar() {
      const year = document.getElementById("year").value;
      const make = document.getElementById("make").value;
      const model = document.getElementById("model").value;
      const state_code = document.getElementById("state").value.toUpperCase();
      const target_hourly_rate = parseFloat(document.getElementById("target-rate").value);

      if (isGuest) {
        const mpgRes = await fetch(API + "/api/guest-mpg?year=" + year + "&make=" + encodeURIComponent(make) + "&model=" + encodeURIComponent(model));
        const mpgData = await mpgRes.json();
        if (mpgData.error) { alert(mpgData.error); return; }

        const car = { year: year, make: make, model: model, mpg: mpgData.mpg, target_hourly_rate: target_hourly_rate, state_code: state_code };
        sessionStorage.setItem("guest_car", JSON.stringify(car));
        setCarReadout(year, make, model, mpgData.mpg, target_hourly_rate);
        show("main-screen");
        return;
      }

      const res = await fetch(API + "/api/save-car", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ year: year, make: make, model: model, state_code: state_code, target_hourly_rate: target_hourly_rate })
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }

      setCarReadout(data.year, data.make, data.model, data.mpg, data.target_hourly_rate);
      show("main-screen");
    }

    async function checkRide() {
      const fare = parseFloat(document.getElementById("fare").value);
      const miles = parseFloat(document.getElementById("miles").value);
      const duration_minutes = parseFloat(document.getElementById("duration").value);
      if (!fare || !miles || !duration_minutes) return;

      let data;

      if (isGuest) {
        const car = JSON.parse(sessionStorage.getItem("guest_car"));
        const gasRes = await fetch(API + "/api/guest-gas-price?state=" + car.state_code);
        const gasData = await gasRes.json();

        const gasCost = (miles / car.mpg) * gasData.price;
        const wearCost = miles * 0.70;
        const profit = Math.round((fare - gasCost - wearCost) * 100) / 100;
        const profitPerHour = Math.round((profit / (duration_minutes / 60)) * 100) / 100;
        const difference = Math.round((profitPerHour - car.target_hourly_rate) * 100) / 100;

        data = {
          profit: profit,
          gas_cost: Math.round(gasCost * 100) / 100,
          wear_cost: Math.round(wearCost * 100) / 100,
          profit_per_hour: profitPerHour,
          gas_price_used: gasData.price,
          worth_it: profitPerHour >= car.target_hourly_rate,
          difference: difference
        };
      } else {
        const res = await fetch(API + "/api/check-ride", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fare: fare, miles: miles, duration_minutes: duration_minutes })
        });
        data = await res.json();
        if (data.error) { alert(data.error); return; }
      }

      lastCheckedRide = { fare: fare, miles: miles, duration_minutes: duration_minutes, profit: data.profit, profit_per_hour: data.profit_per_hour };

      const result = document.getElementById("result");
      result.className = data.worth_it ? "take" : "skip";
      result.style.display = "block";

      document.getElementById("verdict").innerText = data.worth_it ? "Take it" : "Skip it";
      const diffText = data.worth_it
        ? "$" + Math.abs(data.difference) + "/hr above target"
        : "$" + Math.abs(data.difference) + "/hr below target";
      document.getElementById("detail-line").innerText = "$" + data.profit_per_hour + "/hr — " + diffText;

      document.getElementById("breakdown").innerHTML =
        "<div><span>profit</span><span>$" + data.profit + "</span></div>" +
        "<div><span>gas cost</span><span>$" + data.gas_cost + "</span></div>" +
        "<div><span>wear & tear</span><span>$" + data.wear_cost + "</span></div>" +
        "<div><span>gas price used</span><span>$" + data.gas_price_used + "/gal</span></div>";

      document.getElementById("tracked-msg").style.display = "none";
      document.querySelector(".track-question").style.display = "block";
      document.querySelector(".btn-row").style.display = "flex";
    }

    async function logRide(tookIt) {
      document.querySelector(".track-question").style.display = "none";
      document.querySelector(".btn-row").style.display = "none";
      const msg = document.getElementById("tracked-msg");

      if (tookIt && lastCheckedRide) {
        if (isGuest) {
          const rides = JSON.parse(sessionStorage.getItem("guest_rides") || "[]");
          const rideWithDate = Object.assign({}, lastCheckedRide, { date: new Date().toISOString().split("T")[0] });
          rides.unshift(rideWithDate);
          sessionStorage.setItem("guest_rides", JSON.stringify(rides));
        } else {
          await fetch(API + "/api/save-ride", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(lastCheckedRide)
          });
        }
        msg.innerText = "logged — you took this ride";
      } else {
        msg.innerText = "got it — not logged, since you skipped it";
      }
      msg.style.display = "block";
    }

    async function showHistory() {
      let rides, totals;

      if (isGuest) {
        rides = JSON.parse(sessionStorage.getItem("guest_rides") || "[]");
        const today = new Date().toISOString().split("T")[0];
        const todaySum = rides.filter(function(r) { return r.date === today; }).reduce(function(s, r) { return s + r.profit; }, 0);
        const allSum = rides.reduce(function(s, r) { return s + r.profit; }, 0);
        totals = {
          today: round2(todaySum),
          this_week: round2(allSum),
          all_time: round2(allSum)
        };
      } else {
        const res = await fetch(API + "/api/history", { credentials: "include" });
        const data = await res.json();
        rides = data.rides;
        totals = data.totals;
      }

      document.getElementById("totals").innerHTML =
        "<div class=\"totals-row\"><span>today</span><span>$" + totals.today + "</span></div>" +
        "<div class=\"totals-row\"><span>this week</span><span>$" + totals.this_week + "</span></div>" +
        "<div class=\"totals-row\"><span>all time</span><span>$" + totals.all_time + "</span></div>";

      if (rides.length === 0) {
        document.getElementById("history-list").innerHTML =
          "<div style=\"color:#5c7f6b; font-family:'JetBrains Mono',monospace; font-size:13px; text-align:center; padding:10px 0;\">no rides logged yet</div>";
      } else {
        document.getElementById("history-list").innerHTML = rides.map(function(r) {
          return "<div class=\"ride-row\">" +
            "<div><div>" + r.miles + " mi · " + r.duration_minutes + " min</div>" +
            "<div class=\"ride-date\">" + r.date + "</div></div>" +
            "<div class=\"ride-profit\">$" + r.profit + " <span style=\"color:#5c7f6b; font-weight:500;\">($" + r.profit_per_hour + "/hr)</span></div>" +
            "</div>";
        }).join("");
      }

      show("history-screen");
    }

    function round2(n) { return Math.round(n * 100) / 100; }
    function showMain() { show("main-screen"); }

    async function showSetup() {
      document.getElementById("setup-title").innerText = "edit your car settings and desired profit before continuing";

      if (isGuest) {
        const guestCar = sessionStorage.getItem("guest_car");
        await loadYears();
        if (guestCar) {
          const car = JSON.parse(guestCar);
          document.getElementById("year").value = car.year;
          await loadMakes(car.make, car.model);
          document.getElementById("state").value = car.state_code;
          document.getElementById("target-rate").value = car.target_hourly_rate;
        }
        show("setup-screen");
        return;
      }

      const res = await fetch(API + "/api/settings", { credentials: "include" });
      const settings = await res.json();
      await loadYears();
      if (settings.configured) {
        document.getElementById("year").value = settings.year;
        await loadMakes(settings.make, settings.model);
        document.getElementById("state").value = settings.state_code;
        document.getElementById("target-rate").value = settings.target_hourly_rate;
      }
      show("setup-screen");
    }

    init();
  </script>

</body>
</html>
