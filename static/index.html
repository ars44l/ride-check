<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride Check</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(160deg, #eef7f0 0%, #f6f8fa 100%);
      color: #111;
      padding: 28px 18px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 420px; }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 26px;
      text-align: center;
    }
    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: #16803c;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: 0 6px 16px rgba(22,128,60,0.25);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.5px;
      color: #14251a;
    }
    .tagline {
      font-size: 13px;
      color: #6b7a70;
      font-weight: 500;
      margin-top: 3px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 16px 0 6px;
      color: #8a9a90;
    }
    select, input, button {
      width: 100%;
      font-size: 17px;
      padding: 13px 14px;
      border-radius: 11px;
      border: 1.5px solid #e2e8e4;
      box-sizing: border-box;
      font-family: inherit;
      background: white;
    }
    select, input { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    select:focus, input:focus {
      outline: none;
      border-color: #16803c;
      box-shadow: 0 0 0 3px rgba(22,128,60,0.12);
    }
    button {
      background: #14251a;
      color: white;
      border: none;
      font-weight: 700;
      margin-top: 18px;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease, opacity 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    button:disabled { background: #c7cad0; cursor: not-allowed; }

    .btn-row { display: flex; gap: 10px; margin-top: 18px; }
    .btn-row button { margin-top: 0; }
    .btn-take { background: #16803c !important; }
    .btn-skip { background: white !important; color: #a3231f !important; border: 1.5px solid #f0c9c8 !important; }

    .link-btn {
      background: none; color: #8a9a90; font-size: 13px; font-weight: 600;
      text-decoration: none; margin-top: 6px; padding: 10px; border: none;
    }
    .link-btn:active { transform: none; opacity: 0.5; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 2px 10px rgba(20,37,26,0.06);
      border: 1px solid #edf1ee;
    }

    #setup-title {
      font-size: 15px;
      font-weight: 700;
      color: #14251a;
      margin-bottom: 16px;
      text-align: center;
    }

    #result {
      display: none; margin-top: 20px; padding: 24px 20px; border-radius: 16px;
      text-align: center; animation: pop 0.25s ease;
    }
    @keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #result.take { background: linear-gradient(135deg, #16803c, #229150); }
    #result.skip { background: #fbeceb; }
    #verdict { font-size: 27px; font-weight: 800; margin-bottom: 5px; letter-spacing: -0.4px; }
    #result.take #verdict { color: white; }
    #result.skip #verdict { color: #a3231f; }
    #detail-line { font-size: 14px; font-weight: 500; }
    #result.take #detail-line { color: #dcf3e3; }
    #result.skip #detail-line { color: #7a4442; }
    .breakdown {
      margin-top: 16px; font-size: 13px; text-align: left;
      border-radius: 11px; padding: 13px 15px;
    }
    #result.take .breakdown { background: rgba(255,255,255,0.14); color: #eafbee; }
    #result.skip .breakdown { background: rgba(255,255,255,0.6); color: #6b4e4d; }
    .breakdown div { display: flex; justify-content: space-between; padding: 4px 0; }
    .breakdown div:not(:last-child) { border-bottom: 1px solid rgba(0,0,0,0.06); }
    #result.take .breakdown div:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.15); }

    .track-question {
      margin-top: 20px; font-size: 13px; font-weight: 700; text-align: center;
    }
    #result.take .track-question { color: #eafbee; }
    #result.skip .track-question { color: #7a4442; }

    #tracked-msg {
      display: none; margin-top: 12px; text-align: center; font-size: 13px; font-weight: 700;
      color: #14251a; background: rgba(255,255,255,0.85); border-radius: 10px; padding: 10px;
    }

    #history-list { margin-top: 4px; }
    .ride-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 0; border-bottom: 1px solid #eef1ee; font-size: 14px;
    }
    .ride-row:last-child { border-bottom: none; }
    .ride-date { color: #8a9a90; font-size: 12px; margin-top: 2px; }
    .ride-profit { font-weight: 700; color: #16803c; }

    .totals-row { display: flex; justify-content: space-between; padding: 9px 0; font-size: 14px; }
    .totals-row:not(:last-child) { border-bottom: 1px solid #eef1ee; }
    .totals-row span:first-child { color: #8a9a90; font-weight: 600; }
    .totals-row span:last-child { font-weight: 800; color: #14251a; }

    .car-badge {
      font-size: 12px; color: #4d6b57; font-weight: 700; margin-bottom: 16px; text-align: center;
      background: #e6f3ea; padding: 9px 12px; border-radius: 10px;
    }
    .guest-badge {
      font-size: 12px; color: #a3231f; font-weight: 700; margin-bottom: 10px; text-align: center;
      background: #fbeceb; padding: 8px 12px; border-radius: 10px;
    }

    .auth-toggle { display: flex; gap: 8px; margin-bottom: 18px; background: #e9efe9; padding: 4px; border-radius: 12px; }
    .auth-toggle button {
      margin-top: 0; background: transparent; color: #6b7a70; font-size: 14px; padding: 10px; border-radius: 9px;
    }
    .auth-toggle button.active { background: #14251a; color: white; }
    .error-text { color: #a3231f; font-size: 13px; font-weight: 600; margin-top: 10px; display: none; text-align: center; }

    .back-link { padding-left: 0 !important; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">

  <div class="brand">
    <div class="brand-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    </div>
    <h1>Ride Check</h1>
    <div class="tagline">Know your real profit before you accept</div>
  </div>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="hidden">
    <div class="auth-toggle">
      <button id="tab-login" class="active" onclick="switchAuthTab('login')">Log In</button>
      <button id="tab-register" onclick="switchAuthTab('register')">Sign Up</button>
    </div>

    <div class="card">
      <label style="margin-top:0;">Username or Email</label>
      <input id="auth-identifier" type="text" placeholder="arsaldad">

      <label>Password</label>
      <input id="auth-password" type="password" placeholder="••••••••">

      <button id="auth-submit-btn" onclick="submitAuth()">Log In</button>
      <div class="error-text" id="auth-error"></div>
    </div>

    <div style="text-align:center;">
      <button class="link-btn" onclick="continueAsGuest()">Continue as Guest →</button>
    </div>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="hidden">
    <div id="setup-title"></div>
    <div class="card">
      <label style="margin-top:0;">Year</label>
      <select id="year"></select>

      <label>Make</label>
      <select id="make"></select>

      <label>Model</label>
      <select id="model"></select>

      <label>State (2-letter code)</label>
      <input id="state" value="NY" maxlength="2" style="text-transform:uppercase;">

      <label>Target profit per hour ($)</label>
      <input id="target-rate" type="number" value="30">

      <button onclick="saveCar()">Save & Continue</button>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="main-screen" class="hidden">
    <div id="guest-notice" class="guest-badge hidden">Guest mode — your data will be lost when you close this tab</div>
    <div id="car-info" class="car-badge"></div>

    <div class="card">
      <label style="margin-top:0;">Fare ($)</label>
      <input id="fare" type="number" inputmode="decimal" placeholder="e.g. 18.50">

      <label>Miles</label>
      <input id="miles" type="number" inputmode="decimal" placeholder="e.g. 12">

      <label>Duration (minutes)</label>
      <input id="duration" type="number" inputmode="decimal" placeholder="e.g. 25">

      <button onclick="checkRide()">Check Ride</button>
    </div>

    <div id="result">
      <div id="verdict"></div>
      <div id="detail-line"></div>
      <div class="breakdown" id="breakdown"></div>

      <div class="track-question">Did you take this ride?</div>
      <div class="btn-row">
        <button class="btn-take" onclick="logRide(true)">Took it</button>
        <button class="btn-skip" onclick="logRide(false)">Skipped it</button>
      </div>
      <div id="tracked-msg"></div>
    </div>

    <div style="text-align:center; margin-top:10px;">
      <button class="link-btn" onclick="showHistory()">View History →</button><br>
      <button class="link-btn" onclick="showSetup()">Edit Car / Settings</button><br>
      <button class="link-btn" id="logout-btn" onclick="logout()">Log Out</button>
    </div>
  </div>

  <!-- HISTORY SCREEN -->
  <div id="history-screen" class="hidden">
    <button class="link-btn back-link" onclick="showMain()">← Back</button>
    <div class="card" id="totals" style="margin-top:12px;"></div>
    <div class="card" id="history-list" style="margin-top:14px;"></div>
  </div>

</div>

  <script>
    const API = window.location.origin;
    let lastCheckedRide = null;
    let isGuest = false;
    let authMode = "login";

    function show(id) {
      ["auth-screen", "setup-screen", "main-screen", "history-screen"].forEach(function(s) {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      });
    }

    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById("tab-login").classList.toggle("active", mode === "login");
      document.getElementById("tab-register").classList.toggle("active", mode === "register");
      document.getElementById("auth-submit-btn").innerText = mode === "login" ? "Log In" : "Sign Up";
      document.getElementById("auth-error").style.display = "none";
    }

    async function submitAuth() {
      const identifier = document.getElementById("auth-identifier").value.trim();
      const password = document.getElementById("auth-password").value;
      const errorEl = document.getElementById("auth-error");
      errorEl.style.display = "none";

      if (!identifier || !password) {
        errorEl.innerText = "Enter a username/email and password.";
        errorEl.style.display = "block";
        return;
      }

      const isEmail = identifier.includes("@");
      const body = isEmail ? { email: identifier, password: password } : { username: identifier, password: password };
      const endpoint = authMode === "login" ? "/api/login" : "/api/register";

      try {
        const res = await fetch(API + endpoint, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (data.error) {
          errorEl.innerText = data.error;
          errorEl.style.display = "block";
          return;
        }

        isGuest = false;
        await afterLogin();
      } catch (err) {
        errorEl.innerText = "Something went wrong: " + err.message;
        errorEl.style.display = "block";
      }
    }

    function continueAsGuest() {
      isGuest = true;
      document.getElementById("guest-notice").classList.remove("hidden");
      document.getElementById("logout-btn").innerText = "Exit Guest Mode";

      const guestCar = sessionStorage.getItem("guest_car");
      if (guestCar) {
        const car = JSON.parse(guestCar);
        document.getElementById("car-info").innerText =
          car.year + " " + car.make + " " + car.model + " · " + car.mpg + " MPG · Target $" + car.target_hourly_rate + "/hr";
        show("main-screen");
      } else {
        document.getElementById("setup-title").innerText = "Set up your car and target hourly profit to get started";
        loadYears();
        show("setup-screen");
      }
    }

    async function logout() {
      if (isGuest) {
        sessionStorage.clear();
        isGuest = false;
        document.getElementById("guest-notice").classList.add("hidden");
        document.getElementById("logout-btn").innerText = "Log Out";
      } else {
        await fetch(API + "/api/logout", { method: "POST", credentials: "include" });
      }
      show("auth-screen");
    }

    async function afterLogin() {
      const res = await fetch(API + "/api/settings", { credentials: "include" });
      const data = await res.json();
      if (data.configured) {
        document.getElementById("car-info").innerText =
          data.year + " " + data.make + " " + data.model + " · " + data.mpg + " MPG · Target $" + data.target_hourly_rate + "/hr";
        show("main-screen");
      } else {
        document.getElementById("setup-title").innerText = "Set up your car and target hourly profit to get started";
        await loadYears();
        show("setup-screen");
      }
    }

    async function init() {
      const res = await fetch(API + "/api/me", { credentials: "include" });
      const data = await res.json();
      if (data.logged_in) {
        await afterLogin();
      } else {
        show("auth-screen");
      }
    }

    async function loadYears() {
      const res = await fetch(API + "/api/years");
      const years = await res.json();
      const sel = document.getElementById("year");
      sel.innerHTML = years.map(function(y) { return "<option value=\"" + y + "\">" + y + "</option>"; }).join("");
      await loadMakes();
    }

    async function loadMakes(preserveMake, preserveModel) {
      const year = document.getElementById("year").value;
      const res = await fetch(API + "/api/makes?year=" + year);
      const makes = await res.json();
      const sel = document.getElementById("make");
      sel.innerHTML = makes.map(function(m) { return "<option value=\"" + m + "\">" + m + "</option>"; }).join("");
      if (preserveMake && makes.includes(preserveMake)) sel.value = preserveMake;
      await loadModels(preserveModel);
    }

    async function loadModels(preserveModel) {
      const year = document.getElementById("year").value;
      const make = document.getElementById("make").value;
      const res = await fetch(API + "/api/models?year=" + year + "&make=" + encodeURIComponent(make));
      const models = await res.json();
      const sel = document.getElementById("model");
      sel.innerHTML = models.map(function(m) { return "<option value=\"" + m + "\">" + m + "</option>"; }).join("");
      if (preserveModel && models.includes(preserveModel)) sel.value = preserveModel;
    }

    document.getElementById("year").addEventListener("change", function() {
      loadMakes(document.getElementById("make").value, document.getElementById("model").value);
    });
    document.getElementById("make").addEventListener("change", function() {
      loadModels();
    });

    async function saveCar() {
      const year = document.getElementById("year").value;
      const make = document.getElementById("make").value;
      const model = document.getElementById("model").value;
      const state_code = document.getElementById("state").value.toUpperCase();
      const target_hourly_rate = parseFloat(document.getElementById("target-rate").value);

      if (isGuest) {
        const mpgRes = await fetch(API + "/api/guest-mpg?year=" + year + "&make=" + encodeURIComponent(make) + "&model=" + encodeURIComponent(model));
        const mpgData = await mpgRes.json();
        if (mpgData.error) { alert(mpgData.error); return; }

        const car = { year: year, make: make, model: model, mpg: mpgData.mpg, target_hourly_rate: target_hourly_rate, state_code: state_code };
        sessionStorage.setItem("guest_car", JSON.stringify(car));
        document.getElementById("car-info").innerText =
          year + " " + make + " " + model + " · " + mpgData.mpg + " MPG · Target $" + target_hourly_rate + "/hr";
        show("main-screen");
        return;
      }

      const res = await fetch(API + "/api/save-car", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ year: year, make: make, model: model, state_code: state_code, target_hourly_rate: target_hourly_rate })
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }

      document.getElementById("car-info").innerText =
        data.year + " " + data.make + " " + data.model + " · " + data.mpg + " MPG · Target $" + data.target_hourly_rate + "/hr";
      show("main-screen");
    }

    async function checkRide() {
      const fare = parseFloat(document.getElementById("fare").value);
      const miles = parseFloat(document.getElementById("miles").value);
      const duration_minutes = parseFloat(document.getElementById("duration").value);
      if (!fare || !miles || !duration_minutes) return;

      let data;

      if (isGuest) {
        const car = JSON.parse(sessionStorage.getItem("guest_car"));
        const gasRes = await fetch(API + "/api/guest-gas-price?state=" + car.state_code);
        const gasData = await gasRes.json();

        const gasCost = (miles / car.mpg) * gasData.price;
        const wearCost = miles * 0.70;
        const profit = Math.round((fare - gasCost - wearCost) * 100) / 100;
        const profitPerHour = Math.round((profit / (duration_minutes / 60)) * 100) / 100;
        const difference = Math.round((profitPerHour - car.target_hourly_rate) * 100) / 100;

        data = {
          profit: profit,
          gas_cost: Math.round(gasCost * 100) / 100,
          wear_cost: Math.round(wearCost * 100) / 100,
          profit_per_hour: profitPerHour,
          gas_price_used: gasData.price,
          worth_it: profitPerHour >= car.target_hourly_rate,
          difference: difference
        };
      } else {
        const res = await fetch(API + "/api/check-ride", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fare: fare, miles: miles, duration_minutes: duration_minutes })
        });
        data = await res.json();
        if (data.error) { alert(data.error); return; }
      }

      lastCheckedRide = { fare: fare, miles: miles, duration_minutes: duration_minutes, profit: data.profit, profit_per_hour: data.profit_per_hour };

      const result = document.getElementById("result");
      result.className = data.worth_it ? "take" : "skip";
      result.style.display = "block";

      document.getElementById("verdict").innerText = data.worth_it ? "Take it" : "Skip it";
      const diffText = data.worth_it
        ? "$" + Math.abs(data.difference) + "/hr above your target"
        : "$" + Math.abs(data.difference) + "/hr below your target";
      document.getElementById("detail-line").innerText = "$" + data.profit_per_hour + "/hr — " + diffText;

      document.getElementById("breakdown").innerHTML =
        "<div><span>Profit</span><span>$" + data.profit + "</span></div>" +
        "<div><span>Gas cost</span><span>$" + data.gas_cost + "</span></div>" +
        "<div><span>Wear & tear</span><span>$" + data.wear_cost + "</span></div>" +
        "<div><span>Gas price used</span><span>$" + data.gas_price_used + "/gal</span></div>";

      document.getElementById("tracked-msg").style.display = "none";
      document.querySelector(".track-question").style.display = "block";
      document.querySelector(".btn-row").style.display = "flex";
    }

    async function logRide(tookIt) {
      document.querySelector(".track-question").style.display = "none";
      document.querySelector(".btn-row").style.display = "none";
      const msg = document.getElementById("tracked-msg");

      if (tookIt && lastCheckedRide) {
        if (isGuest) {
          const rides = JSON.parse(sessionStorage.getItem("guest_rides") || "[]");
          const rideWithDate = Object.assign({}, lastCheckedRide, { date: new Date().toISOString().split("T")[0] });
          rides.unshift(rideWithDate);
          sessionStorage.setItem("guest_rides", JSON.stringify(rides));
        } else {
          await fetch(API + "/api/save-ride", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(lastCheckedRide)
          });
        }
        msg.innerText = "Logged — you took this ride ✓";
      } else {
        msg.innerText = "Got it — not logged, since you skipped it.";
      }
      msg.style.display = "block";
    }

    async function showHistory() {
      let rides, totals;

      if (isGuest) {
        rides = JSON.parse(sessionStorage.getItem("guest_rides") || "[]");
        const today = new Date().toISOString().split("T")[0];
        const todaySum = rides.filter(function(r) { return r.date === today; }).reduce(function(s, r) { return s + r.profit; }, 0);
        const allSum = rides.reduce(function(s, r) { return s + r.profit; }, 0);
        totals = {
          today: round2(todaySum),
          this_week: round2(allSum),
          all_time: round2(allSum)
        };
      } else {
        const res = await fetch(API + "/api/history", { credentials: "include" });
        const data = await res.json();
        rides = data.rides;
        totals = data.totals;
      }

      document.getElementById("totals").innerHTML =
        "<div class=\"totals-row\"><span>Today</span><span>$" + totals.today + "</span></div>" +
        "<div class=\"totals-row\"><span>This week</span><span>$" + totals.this_week + "</span></div>" +
        "<div class=\"totals-row\"><span>All time</span><span>$" + totals.all_time + "</span></div>";

      if (rides.length === 0) {
        document.getElementById("history-list").innerHTML =
          "<div style=\"color:#8a9a90; font-size:14px; text-align:center; padding:10px 0;\">No rides logged yet.</div>";
      } else {
        document.getElementById("history-list").innerHTML = rides.map(function(r) {
          return "<div class=\"ride-row\">" +
            "<div><div>" + r.miles + " mi · " + r.duration_minutes + " min</div>" +
            "<div class=\"ride-date\">" + r.date + "</div></div>" +
            "<div class=\"ride-profit\">$" + r.profit + " <span style=\"color:#8a9a90; font-weight:500;\">($" + r.profit_per_hour + "/hr)</span></div>" +
            "</div>";
        }).join("");
      }

      show("history-screen");
    }

    function round2(n) { return Math.round(n * 100) / 100; }
    function showMain() { show("main-screen"); }

    async function showSetup() {
      document.getElementById("setup-title").innerText = "Edit your car settings and desired profit before continuing";

      if (isGuest) {
        const guestCar = sessionStorage.getItem("guest_car");
        await loadYears();
        if (guestCar) {
          const car = JSON.parse(guestCar);
          document.getElementById("year").value = car.year;
          await loadMakes(car.make, car.model);
          document.getElementById("state").value = car.state_code;
          document.getElementById("target-rate").value = car.target_hourly_rate;
        }
        show("setup-screen");
        return;
      }

      const res = await fetch(API + "/api/settings", { credentials: "include" });
      const settings = await res.json();
      await loadYears();
      if (settings.configured) {
        document.getElementById("year").value = settings.year;
        await loadMakes(settings.make, settings.model);
        document.getElementById("state").value = settings.state_code;
        document.getElementById("target-rate").value = settings.target_hourly_rate;
      }
      show("setup-screen");
    }

    init();
  </script>

</body>
</html>
